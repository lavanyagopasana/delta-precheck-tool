# CI/CD for delta-precheck-tool.
#
# One file rather than two on purpose: the deploy job declares `needs` on the three test jobs, so
# GitHub itself guarantees nothing reaches the server unless the full suite passed on that exact
# commit. Split across two workflow files, the link would have to be a `workflow_run` trigger --
# which resolves the workflow definition from the default branch rather than from the commit being
# deployed, and is a well-known way to end up shipping a deploy that skipped its own tests.
#
# Nothing ran these suites automatically before this file existed, so a red X here is the first
# automated signal this project has ever had. Treat it as real rather than as noise to re-run.
#
# TESTS are automatic; DEPLOYS are not. Every push and PR runs the three test jobs. Nothing ever
# deploys on a push -- not even to main. The deploy job runs only on an explicit manual trigger, so
# a merge is never also a production restart. See the comment on that job.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy to production after tests pass (leave off for a test-only run)"
        type: boolean
        default: false

# A superseded test run is just wasted minutes; a superseded *deploy* is dangerous, so the deploy
# job overrides this with its own non-cancelling concurrency group below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (JUnit + H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Maven wrapper exists in this repo (there is no backend/mvnw), so the runner's own Maven
      # is used. If a wrapper is ever added, switch this to ./mvnw so CI and local builds pin the
      # same Maven version instead of drifting apart silently.
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Tests run against H2 via backend/src/test/resources/application-test.properties -- never a
      # real Postgres, and never the shared dev database (.claude/rules/testing-standard.md). That
      # is why this job needs no database service container.
      - name: mvn test
        working-directory: backend
        run: mvn -B -ntp test

      # EndpointCharacterizationTest STRICT-compares endpoint JSON against committed goldens under
      # src/test/resources/snapshots/. A failure reading "Unexpected: <field>" is not flaky -- it
      # means a DTO gained a field. The fix is to regenerate the snapshot locally and review the
      # diff (CLAUDE.md), and having the reports attached to the run is what makes that diagnosable
      # without reproducing the whole build locally first.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests (Jest + RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # CI=true is what makes react-scripts test exit instead of entering watch mode. Without it
      # this step hangs until the job timeout rather than failing, which reads as an infra problem
      # instead of a missing flag.
      - name: Run tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build-only, no push. This job exists to catch the class of failure the test jobs cannot see:
      # a Dockerfile that no longer builds, or a frontend build arg added to docker-compose.yml
      # without a matching ARG in frontend/Dockerfile -- which has already shipped a bundle with
      # clientId:"" once (see frontend/Dockerfile's own comment on that incident).
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Placeholder GUIDs, but deliberately NON-BLANK. What this build proves is that every
      # --build-arg has a matching ARG in frontend/Dockerfile and reaches `npm run build`; a value
      # that arrives as an empty string proves nothing, and empty is exactly how a bundle shipped
      # with clientId:"" once. The image is never pushed or deployed, so the real identifiers would
      # add nothing here beyond putting them in a public file.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            REACT_APP_AZURE_CLIENT_ID=00000000-0000-0000-0000-000000000000
            REACT_APP_AZURE_TENANT_ID=00000000-0000-0000-0000-000000000000
            REACT_APP_API_BASE=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to production
    needs: [backend-tests, frontend-tests, docker-build]
    # Manual only, deliberately. A push to main runs the three test jobs and stops there -- it does
    # NOT deploy. Continuous deployment on every merge is the usual default, but it is the wrong
    # default here: this stack rebuilds images on the server and takes the site through a container
    # recreation, so a docs typo merged at 6pm would restart production. Deploying is a decision
    # somebody makes, not a side effect of merging.
    #
    # Trigger it with the /deploy skill (.claude/commands/deploy.md), or from the Actions tab:
    # Run workflow -> tick "Also deploy to production after tests pass". The tests still run first
    # either way; `needs` below is what enforces that.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest

    # Add required reviewers (or a deployment branch rule) to this environment under repo
    # Settings -> Environments to make every production deploy wait on a human click.
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTH_BASE || 'https://deltaprechecks.cftools.live' }}

    # cancel-in-progress is FALSE here, unlike the workflow-level group above. Cancelling a deploy
    # part-way through `docker compose up` leaves the stack half-recreated with no record of which
    # half, which is materially worse than letting two deploys queue.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_HOST are not set. See deploy/CI-CD.md for setup."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pinning the host key via a secret is what makes this connection genuinely authenticated.
          # ssh-keyscan is trust-on-first-use: it accepts whatever answers at that address, so a
          # man-in-the-middle on the first connection is undetectable. It stays as a fallback so a
          # half-configured repo fails loudly at the deploy rather than at the SSH handshake, but it
          # warns every time -- set DEPLOY_KNOWN_HOSTS (`ssh-keyscan -p <port> <host>`, run from a
          # machine you trust) to close it.
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set - falling back to ssh-keyscan (trust-on-first-use)."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Preflight (refuse to deploy into a state that would break the site)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/delta-precheck-tool' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH" || { echo "::error::$DEPLOY_PATH does not exist on the server"; exit 1; }

          command -v docker >/dev/null || { echo "::error::docker is not on PATH for this user"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "::error::docker compose v2 is unavailable"; exit 1; }
          docker info >/dev/null 2>&1 || { echo "::error::this user cannot reach the docker daemon"; exit 1; }

          # .env is gitignored and holds POSTGRES_PASSWORD and TICKETING_API_TOKEN, so CI can never
          # supply it. Compose interpolates a missing variable to an empty string instead of
          # failing, and a blank AZURE_CLIENT_ID brings the backend up FULLY OPEN. An absent .env is
          # therefore a hard stop, not a warning.
          [ -f .env ] || { echo "::error::.env is missing in $DEPLOY_PATH - copy .env.example and fill it in"; exit 1; }

          git rev-parse --is-inside-work-tree >/dev/null 2>&1 \
            || { echo "::error::$DEPLOY_PATH is not a git checkout; this pipeline deploys by git"; exit 1; }

          # The compose file live on the server was hand-written there and is untracked, while the
          # repo ships its own at the same path. `git reset --hard` overwrites an untracked file
          # present in the target commit WITHOUT complaining, so this used to be a hard refusal: the
          # tracked file started a proxy container binding :80 and :443, which does not take over
          # from the host nginx holding those ports -- it loses a race against it.
          #
          # That is no longer true. The proxy service now sits behind a compose profile the deploy
          # never passes, and the tracked file publishes the same 127.0.0.1:8532/8533 mappings the
          # server's own file does. Replacing it is therefore a like-for-like swap, so the Deploy
          # step below does it as a one-time migration -- keeping a timestamped copy first -- instead
          # of requiring somebody with shell access to move it aside by hand.
          if [ -f docker-compose.yml ] && ! git ls-files --error-unmatch docker-compose.yml >/dev/null 2>&1; then
            echo "::warning::docker-compose.yml here is untracked (hand-written on the server)."
            echo "::warning::The Deploy step will back it up and replace it with the tracked version."
            echo "::warning::Expected exactly once. Seeing this on a later deploy means something is rewriting it."
          fi

          # A tracked file edited directly on the server means somebody hotfixed in place. Reporting
          # it and stopping is better than discarding their change without telling anyone.
          if ! git diff --quiet HEAD -- .; then
            echo "::error::tracked files are modified on the server:"
            git diff --name-only HEAD -- . | sed 's/^/::error::  /'
            echo "::error::Commit or discard them there, then re-run this deploy."
            exit 1
          fi
          echo "Preflight OK on $(hostname) at $DEPLOY_PATH"
          REMOTE

      - name: Back up the database before anything changes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/delta-precheck-tool' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # This runs before the checkout, not after, and that ordering is the whole point. The
          # schema is Hibernate ddl-auto=update: the new code alters the live database on startup
          # with no migration file and no down-migration. The rollback step can restore the previous
          # code but cannot restore the previous schema, so old code would then run against a shape
          # it never saw. This dump is the only thing that makes that state recoverable.

          # Read the two values out of .env rather than sourcing it. `. ./.env` would execute the
          # file, and it holds POSTGRES_PASSWORD and TICKETING_API_TOKEN -- a value containing a
          # backtick or $(...) would run as a command.
          PGUSER="$(sed -n 's/^POSTGRES_USER=//p' .env | tail -1 | tr -d '\042\047')"
          PGDB="$(sed -n 's/^POSTGRES_DB=//p' .env | tail -1 | tr -d '\042\047')"
          if [ -z "$PGUSER" ] || [ -z "$PGDB" ]; then
            echo "::error::POSTGRES_USER / POSTGRES_DB not found in .env - cannot take a backup"
            exit 1
          fi

          # The live compose file calls the database service `postgres`; the repo's calls it `db`.
          # Both names are checked so this step works either side of the cutover rather than only
          # after it.
          SVC=""
          for candidate in db postgres; do
            if docker compose ps --services --filter status=running 2>/dev/null | grep -qx "$candidate"; then
              SVC="$candidate"; break
            fi
          done
          if [ -z "$SVC" ]; then
            echo "::warning::no running database service (tried 'db' and 'postgres') - skipping backup."
            echo "::warning::Expected on a first deploy, when there is no data to lose. Not expected otherwise."
            exit 0
          fi

          mkdir -p db_backups   # gitignored, so `git reset --hard` below leaves it alone
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="db_backups/pre-deploy-${STAMP}-${SHA:0:8}.sql.gz"

          echo "Dumping database '$PGDB' from service '$SVC' to $OUT"
          # -T because there is no TTY on a CI runner. Without it docker refuses to run.
          docker compose exec -T "$SVC" pg_dump -U "$PGUSER" "$PGDB" | gzip > "$OUT"

          # A dump that silently produced nothing is worse than no dump at all, because it looks
          # like protection that is not there. Verify rather than trust the exit code: pg_dump's
          # status is masked by the pipe into gzip.
          gzip -t "$OUT" || { echo "::error::backup is not a valid gzip file"; rm -f "$OUT"; exit 1; }
          if ! gzip -dc "$OUT" | head -20 | grep -q "PostgreSQL database dump"; then
            echo "::error::backup does not look like a pg_dump - refusing to deploy behind it"
            rm -f "$OUT"; exit 1
          fi
          echo "Backup OK: $(du -h "$OUT" | cut -f1) at $OUT"

          # Keep the ten most recent. These are uncompressed-schema-plus-data dumps of a tracker
          # database, not large, but unbounded growth on a production disk is its own outage.
          ls -1t db_backups/pre-deploy-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm -f
          echo "Retained: $(ls -1 db_backups/pre-deploy-*.sql.gz 2>/dev/null | wc -l) backup(s)"
          REMOTE
      # Opt-in, via a repository variable MANAGE_ENV=true. Without it this step is skipped entirely
      # and the .env already on the server is used untouched, which is how the pipeline behaved
      # before this step existed.
      #
      # MERGE, not replace. The .env on this server was populated by the infrastructure team, and
      # this step deliberately does not take ownership of the whole file: it starts from what is
      # already there, applies only the keys GitHub actually defines, and leaves everything else --
      # including their comments and any key this template has never heard of -- exactly as it was.
      # That allows adopting this incrementally: a new key can be added in Settings alone, without
      # first migrating every existing value into GitHub.
      #
      # The cost of merging is that an unset variable in GitHub cannot mean "delete this key" -- it
      # has to mean "leave it alone", or every optional value would be wiped on the first run.
      # ENV_REMOVE_KEYS is the explicit way to delete, so removing a key added by mistake is still
      # done from Settings rather than needing a server login.
      - name: Merge .env from GitHub secrets and variables
        if: vars.MANAGE_ENV == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/delta-precheck-tool' }}
          # Comma or space separated key NAMES to delete from the server's .env -- a key added by
          # mistake, or one this app no longer reads (JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN).
          ENV_REMOVE_KEYS: ${{ vars.ENV_REMOVE_KEYS }}
          # Non-secret settings live in Variables so they stay readable and editable. Only genuine
          # credentials go in Secrets. Any of these left unset is simply not applied -- the server
          # keeps whatever it already had for that key.
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_ALLOWED_EMAIL_DOMAIN: ${{ vars.AZURE_ALLOWED_EMAIL_DOMAIN }}
          AZURE_REQUIRE_ALLOWLIST: ${{ vars.AZURE_REQUIRE_ALLOWLIST }}
          AZURE_AUTO_PROVISION_DOMAIN: ${{ vars.AZURE_AUTO_PROVISION_DOMAIN }}
          APP_FIRST_ADMIN_EMAIL: ${{ secrets.APP_FIRST_ADMIN_EMAIL || vars.APP_FIRST_ADMIN_EMAIL }}
          HOTJAR_SITE_ID: ${{ vars.HOTJAR_SITE_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TICKETING_BASE_URL: ${{ vars.TICKETING_BASE_URL }}
          TICKETING_API_TOKEN: ${{ secrets.TICKETING_API_TOKEN }}
        run: |
          set -euo pipefail

          # Only keys with a non-empty value are sent. An unset variable is not an instruction to
          # blank the server's copy: if it were, turning MANAGE_ENV on with three keys configured
          # would wipe the other fourteen.
          umask 077
          : > env.overrides
          applied=""
          for v in APP_DOMAIN POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
                   AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_ALLOWED_EMAIL_DOMAIN \
                   AZURE_REQUIRE_ALLOWLIST AZURE_AUTO_PROVISION_DOMAIN APP_FIRST_ADMIN_EMAIL \
                   HOTJAR_SITE_ID SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD \
                   TICKETING_BASE_URL TICKETING_API_TOKEN; do
            val="${!v:-}"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$v" "$val" >> env.overrides
              applied="$applied $v"
            fi
          done
          echo "Keys GitHub will apply:${applied:- (none)}"
          echo "Keys GitHub will remove: ${ENV_REMOVE_KEYS:-(none)}"

          # Sent over stdin rather than as command arguments. Arguments are visible in `ps` output
          # to every user on that host while the command runs, and this file holds the database
          # password and the ticketing token.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env.overrides'" < env.overrides
          rm -f env.overrides

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' ENV_REMOVE_KEYS='$ENV_REMOVE_KEYS' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          umask 077
          chmod 600 .env.overrides

          # Start from what is already there. Comments, ordering and unknown keys all survive,
          # because only lines whose key is being overridden or removed are touched.
          if [ -f .env ]; then cp -p .env .env.merged; else : > .env.merged; fi

          # Removals first, so a key can be removed and re-added in the same run.
          for k in $(printf '%s' "${ENV_REMOVE_KEYS:-}" | tr ',' ' '); do
            case "$k" in
              *[!A-Z0-9_]*|"") echo "::error::ENV_REMOVE_KEYS contains a non-key value: '$k'"; exit 1 ;;
            esac
            if grep -q "^${k}=" .env.merged; then
              sed -i "/^${k}=/d" .env.merged
              echo "removed $k"
            else
              echo "::warning::ENV_REMOVE_KEYS lists $k, which is not in .env - nothing to remove"
            fi
          done

          # Delete-then-append rather than an in-place sed substitution: the replacement text would
          # otherwise be interpreted by sed, and these values are passwords and URLs full of / and &.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            key="${line%%=*}"
            sed -i "/^${key}=/d" .env.merged
            printf '%s\n' "$line" >> .env.merged
          done < .env.overrides
          rm -f .env.overrides

          # Validated on the RESULT, not on what GitHub supplied -- in merge mode a required key is
          # allowed to come from the file the infrastructure team already wrote. A blank
          # AZURE_CLIENT_ID is the case that matters most: SecurityConfig then treats auth as
          # unconfigured and every /api route becomes permitAll, with no error and no failed
          # startup, so it must never reach the server.
          missing=""
          for v in APP_DOMAIN POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
                   AZURE_CLIENT_ID AZURE_TENANT_ID APP_FIRST_ADMIN_EMAIL; do
            grep -qE "^${v}=.+" .env.merged || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::merged .env would be missing or blank for:$missing"
            echo "::error::Set them in GitHub Settings, or leave them in the server's .env. Not installed."
            rm -f .env.merged
            exit 1
          fi

          # The previous file is kept, not overwritten in place. If a value in Settings is wrong,
          # the way back is a copy on disk -- GitHub will not show you a secret again once saved.
          if [ -f .env ] && cmp -s .env .env.merged; then
            echo ".env unchanged"
            rm -f .env.merged
          else
            [ -f .env ] && cp -p .env ".env.bak-$(date -u +%Y%m%dT%H%M%SZ)"
            ls -1t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
            mv .env.merged .env
            echo ".env updated; previous version kept as .env.bak-*"
          fi
          chmod 600 .env

          # Names only. Never the values -- this output goes into a build log.
          echo "Final .env keys: $(grep -oE '^[A-Z_]+' .env | sort | tr '\n' ' ')"
          REMOTE

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/delta-precheck-tool' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Recorded before anything changes, so the rollback step has a revision to return to.
          PREV="$(git rev-parse HEAD)"
          echo "$PREV" > .deploy-previous-sha
          echo "Previous revision: $PREV"

          # If the compose file here is untracked, this is the one-time migration from the
          # hand-written file to the tracked one. Keep a timestamped copy: it is the only record of
          # what production was actually running, and it is about to be overwritten.
          MIGRATE_FROM=""
          if [ -f docker-compose.yml ] && ! git ls-files --error-unmatch docker-compose.yml >/dev/null 2>&1; then
            MIGRATE_FROM="docker-compose.yml.pre-ci-$(date -u +%Y%m%dT%H%M%SZ)"
            cp -p docker-compose.yml "$MIGRATE_FROM"
            echo "One-time migration: previous compose file kept as $MIGRATE_FROM"
          fi

          # Checking out the exact SHA that passed tests, not a branch tip. `git pull` would take
          # whatever landed on main in the minutes since -- untested code, deployed under the label
          # of a green run.
          git fetch --quiet origin "$SHA" || git fetch --quiet origin
          git reset --hard "$SHA"
          echo "Now at: $(git log -1 --oneline)"

          # Build BEFORE stopping anything. The frontend image runs a full `npm run build`, so
          # building as part of `up` would hold the site down for the length of the build rather than
          # the length of a container swap. The old stack keeps serving traffic throughout this.
          docker compose build

          # Only on the migration run: stop the old stack using the OLD file, so its containers
          # release the loopback ports and their container_names before the new ones claim them.
          # Relying on `up --remove-orphans` to do this implicitly means relying on convergence
          # ordering that is not documented -- and a port still held by a container that has not gone
          # away yet is a failed deploy. `down` without -v leaves every volume untouched.
          if [ -n "$MIGRATE_FROM" ]; then
            echo "Stopping the previous stack defined by $MIGRATE_FROM"
            docker compose -f "$MIGRATE_FROM" down --remove-orphans || true
          fi

          # Images are already built, so this is just the container swap. --remove-orphans clears
          # containers left by a compose file whose service names differ (the old file calls the
          # database `postgres`, the repo calls it `db`); without it the old one keeps running and
          # holding its volume. The proxy service is behind a profile that is deliberately NOT passed
          # here, so this can never bind :80/:443 or collide with the host nginx.
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE

      - name: Health check
        env:
          BASE: ${{ vars.DEPLOY_HEALTH_BASE || 'https://deltaprechecks.cftools.live' }}
        run: |
          set -euo pipefail
          echo "Probing $BASE"
          FRONT=000
          API=000

          # Spring needs a moment after the container reports as running, so a single immediate curl
          # reports a false failure. Ten tries at six seconds covers a cold JVM start comfortably.
          for i in $(seq 1 10); do
            FRONT=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/" || echo 000)
            API=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/me" || echo 000)
            echo "attempt $i: frontend=$FRONT api/me=$API"
            if [ "$FRONT" = "200" ] && [ "$API" != "000" ]; then
              break
            fi
            sleep 6
          done

          [ "$FRONT" = "200" ] || { echo "::error::frontend did not return 200 (got $FRONT)"; exit 1; }

          # 401 is the PASS here and 200 is the alarm. An unauthenticated /api/me answering 200 means
          # AZURE_CLIENT_ID resolved blank, every /api route became permitAll, and the backend is
          # serving the entire app with no authentication at all -- a state in which it starts
          # cleanly and every page renders, so nothing else catches it. That has already been a real
          # incident on this project once (.claude/rules/security-rules.md).
          if [ "$API" = "200" ]; then
            echo "::error::/api/me returned 200 unauthenticated - the backend is running FULLY OPEN."
            echo "::error::AZURE_CLIENT_ID is blank in the server's .env. Failing so this rolls back."
            exit 1
          fi
          [ "$API" = "401" ] || echo "::warning::/api/me returned $API (401 expected). Worth a look."
          echo "Health check passed: frontend 200, /api/me $API (authentication enforced)."

      - name: Roll back on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/delta-precheck-tool' }}
        run: |
          set -euo pipefail
          # Best-effort by design: if the failure happened in Configure SSH or Preflight then nothing
          # on the server changed, so this reports no work to do rather than a second failure.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE' || true
          set -uo pipefail
          cd "$DEPLOY_PATH" 2>/dev/null || exit 0
          echo "--- container state at failure ---"
          docker compose ps || true
          echo "--- last 80 log lines ---"
          docker compose logs --tail=80 || true
          [ -f .deploy-previous-sha ] || { echo "nothing was deployed, no rollback needed"; exit 0; }
          PREV="$(cat .deploy-previous-sha)"
          if [ "$PREV" = "$(git rev-parse HEAD)" ]; then
            echo "already at $PREV, no rollback needed"
            exit 0
          fi
          echo "Rolling back to $PREV"
          git reset --hard "$PREV"
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE
          echo "::error::Deploy failed. A rollback was attempted - see the container state and logs above."
