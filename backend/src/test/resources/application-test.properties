# Test profile: layered on top of the base application.properties (via @ActiveProfiles("test")).
# Overrides only what a hermetic characterization test needs -- an in-memory H2 DB, no SMTP, and
# auth turned OFF (blank client-id => SecurityConfig.permitAll), so endpoints are reachable without
# a real Microsoft token and services treat the caller as "everything visible" (deterministic JSON).

spring.datasource.url=jdbc:h2:mem:deltatest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Auth off for tests.
azure.client-id=
azure.tenant-id=
azure.allowed-email-domain=
azure.require-allowlist=false
azure.auto-provision-domain=

# No email in tests (blank username => EmailService is a no-op and logs a warning).
spring.mail.username=
spring.mail.password=

# Keep uploads out of the real folder.
app.upload-dir=${java.io.tmpdir}/delta-test-uploads
app.frontend-url=http://localhost:3000
app.allowed-origins=http://localhost:3000

# Roster seeding OFF for tests. Every @SpringBootTest here shares one H2 database, so a bootstrap
# that inserts 6 teams and 31 users is visible to every other test -- including the characterization
# snapshots and anything counting app_users. It passed locally and failed in CI purely because
# surefire orders test classes differently on Linux than on Windows, which is the definition of a
# test that is green by luck.
#
# TeamRosterBootstrapTest turns it back on for itself via @TestPropertySource, so the seeding path
# is still covered end-to-end -- just in a context that nothing else shares.
app.seed-team-roster=false

# Same reasoning, same fix, for SampleProjectBootstrap: it inserts 2 projects, servers, pairs,
# tickets and a completed Delta cycle, which the characterization snapshots and dashboard/project
# rollup tests were never written to expect (e.g. preDeltaCyclesCompleted going from 0 to 1).
app.seed-sample-projects=false
