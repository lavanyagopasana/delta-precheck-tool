# Dev-only diagnostics. Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# (or SPRING_PROFILES_ACTIVE=dev). Never enabled in the default/production profile -- SQL logging
# and Hibernate statistics are expensive and leak query shapes into logs.
#
# This is the temporary SQL visibility from the performance audit's Phase 1, kept here (dev profile
# only) so anyone can re-trace a slow request without re-adding it by hand.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.generate_statistics=true
