spring.application.name=delta-migration-tracker

# Overridable so a container/host can remap the listen port without a rebuild (Cloud Run, Heroku and
# similar inject PORT; SERVER_PORT covers a plain docker -e). 8081 stays the local default.
server.port=${SERVER_PORT:${PORT:8081}}

# Unlike MySQL's connection string, Postgres has no createDatabaseIfNotExist-style flag -- the
# target database has to exist before the app's first connection. One-time setup:
# `createdb delta_migration_tracker` (or `psql -c "CREATE DATABASE delta_migration_tracker;"`) as
# whatever role DB_USERNAME/DB_PASSWORD resolve to. Everything after that (tables, columns,
# constraints) is still created/evolved automatically by ddl-auto=update below.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delta_migration_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool. Defaults (10 max / min-idle == max) are usually fine, but making them
# explicit documents intent and lets leak detection catch any connection held > 30s (e.g. a slow
# external call accidentally left inside a @Transactional method -- the exact footgun this audit fixed).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# No spring.jpa.database-platform here -- Hibernate 6 detects the dialect (now PostgreSQLDialect)
# from the JDBC connection metadata on its own; setting it explicitly only produced a deprecation
# warning under the old MySQL config, so it's left unset rather than swapped to the Postgres
# equivalent and warned about again.

# JDBC batching for bulk update/flush paths. NOTE: every entity uses GenerationType.IDENTITY, so
# Hibernate can't batch INSERTs (it must round-trip each row to read back the generated id) -- this
# mainly benefits batched UPDATEs and multi-entity flushes. Harmless and standard to set regardless.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Gzip JSON/text responses over 1KB (list endpoints, dashboard summary) to cut transfer time.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# 1GB so a full screen recording of a Delta run can be attached as evidence, not just a screenshot.
# Storage is bounded by deleting a project once its servers are decommissioned (ServerPurgeService),
# which now also removes the per-cycle snapshot files a decline leaves behind -- before that fix those
# were orphaned on disk forever, which would have made this limit genuinely dangerous.
#
# THREE limits must agree or the largest one is a fiction:
#   1. this property
#   2. client_max_body_size on whatever proxy terminates TLS and routes /api (see
#      deploy/edge-proxy.conf.example) -- its nginx default of 1m is what actually capped the
#      deployed site at ~1MB while this file advertised 20MB
#   3. MAX_EVIDENCE_FILE_SIZE_MB in frontend/src/constants/index.js, which rejects oversized files
#      client-side so a user learns in a second rather than after a long upload
#
# file-size-threshold=0 keeps Spring streaming straight to a temp file instead of buffering in heap.
# Cheap insurance at any size, and it means concurrent uploads cost disk, not heap.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=0

# max-swallow-size is deliberately a real number, not -1. Tomcat has to read and discard an
# oversized body before it can send the 413, so it must exceed the limit above or the client sees a
# connection reset instead of a readable error. -1 means "swallow without bound", which lets one
# client stream unlimited data into a request that was already rejected. 30MB gives a modestly
# oversized upload a clean error and cuts off anything absurd.
server.tomcat.connection-timeout=120000
server.tomcat.max-swallow-size=30MB

# Local dev default is a relative "uploads" folder next to wherever the jar runs from. In a
# container, this MUST be overridden (APP_UPLOAD_DIR) to an absolute path backed by a mounted
# volume (Docker volume / Kubernetes PersistentVolumeClaim) -- a container's own filesystem is
# wiped on every restart/redeploy, so anything written to the default relative path is lost the
# next time the container recreates. Read by both FileStorageService (writes) and WebConfig
# (serves /uploads/** statically) -- both point at this same property, so one override covers both.
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# File-upload type validation (see FileStorageService.validateType). NOW STAGE 2 == true: an upload
# whose extension is outside ALLOWED_EXTENSIONS, or whose magic bytes contradict its extension, is
# rejected with a 400 naming the accepted formats. Zero-byte files and path-traversal filenames are
# rejected/neutralized unconditionally regardless.
#
# It ran as Stage 1 (log-only) so real uploads could be observed first. Moved to Stage 2 because the
# observe mode was doing exactly what it was designed to detect and nothing more: an nvm-setup.exe was
# attached as pre-check evidence on the deployed site, logged as a warning, and stored anyway. An
# executable is not evidence of anything, and /uploads/** is same-origin -- UploadDispositionFilter
# forces a download rather than inline rendering, but the right answer is not to accept the file.
#
# The allowlist is deliberately broad (images, PDF, Office, text/data, email exports, archives, screen
# recordings) so this rejects the irrelevant without blocking real evidence. Set false to fall back to
# log-only if a legitimate format turns out to be missing -- and add it to ALLOWED_EXTENSIONS rather
# than leaving enforcement off.
app.upload.enforce-validation=${APP_UPLOAD_ENFORCE_VALIDATION:true}

# Comma-separated list of origins allowed to call /api/**. Add the deployed frontend's origin here
# via APP_ALLOWED_ORIGINS in production -- localhost:3000 stays the default for local dev.
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# Sign-in with Microsoft (Entra ID). The real client ID and tenant ID are NOT in this file: they
# come from AZURE_CLIENT_ID / AZURE_TENANT_ID, set in .env on the server (or in GitHub Settings when
# MANAGE_ENV is on). This repository is public, and while neither value is a credential -- both are
# compiled into the JavaScript bundle and served to every visitor, and the thing actually guarding
# sign-in is Microsoft's own password/MFA check -- there is no reason a public file should name the
# tenant to aim at. Real values were committed here between 2026-08-11 and 2026-08-19.
#
# The defaults are all-zero GUIDs rather than blank, and that distinction is the whole point.
# SecurityConfig reads @Value("${azure.client-id:}") with its own EMPTY fallback, so deleting these
# lines would not fail loudly -- it would resolve to blank, authConfigured() would return false, and
# every /api/** route would become permitAll with no authentication and no error. A non-blank
# placeholder keeps auth ENABLED, so a deployment that forgets the environment variable rejects every
# token instead of admitting everyone. Loud beats silent.
#
# Consequence worth knowing: running locally without AZURE_CLIENT_ID set no longer lets you sign in.
# That is deliberate. Set the variable, or set it explicitly to blank to run open on purpose.
#
# azure.allowed-email-domain is temporarily blank (no domain restriction) while testing with
# non-cloudfuze.com accounts. Set AZURE_ALLOWED_EMAIL_DOMAIN=cloudfuze.com to re-enable it. The
# AppUser allowlist (admin-managed, see AdminController) still applies regardless -- only people
# an admin has explicitly added can actually use the app.
azure.client-id=${AZURE_CLIENT_ID:00000000-0000-0000-0000-000000000000}
azure.tenant-id=${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
azure.allowed-email-domain=${AZURE_ALLOWED_EMAIL_DOMAIN:}

# Only people an admin has explicitly added under Manage Access can sign in. Set
# AZURE_REQUIRE_ALLOWLIST=false only for local testing with accounts nobody's added yet --
# never in a real deployment.
azure.require-allowlist=${AZURE_REQUIRE_ALLOWLIST:true}

# Anyone signing in with this email domain is auto-added to Manage Access (role: Migration
# Engineer) the first time they show up -- no admin approval needed, and this applies even when
# azure.require-allowlist=true. Other domains still need an admin to add them manually.
#
# BLANK BY DEFAULT as of 2026-08-26, changed from cloudfuze.com. Auto-provisioning made sense while
# the roster was whoever happened to sign in. It stopped making sense once Teams became the record
# of who does what: a silently-created MIGRATION_ENGINEER belongs to no team, so they show up in
# every engineer picker that falls back to the unfiltered list, and nobody decided they should be
# there. The allowlist is now the single answer to "who works here", and it is edited on purpose.
#
# Set AZURE_AUTO_PROVISION_DOMAIN=cloudfuze.com to bring the old behaviour back for an environment
# that wants self-service sign-up. Note that with azure.require-allowlist=true (the default), a
# blank value means an unlisted person is refused rather than quietly admitted -- which is the
# point, but it does mean a genuinely new hire needs an admin to add them.
azure.auto-provision-domain=${AZURE_AUTO_PROVISION_DOMAIN:}

# Creates the delivery teams and their members on startup from seed/teams-roster.csv (see
# TeamRosterBootstrap). On by default because the alternative was an admin hand-importing a CSV into
# every fresh database, production included, before any engineer picker scoped to anything -- work a
# person should not have to remember, and invisible when forgotten.
#
# Safe to leave on: it is grouped by MANAGER, so a team an admin already set up by hand is skipped
# entirely rather than duplicated, an ADMIN row is never touched, and nobody who already has a team
# is moved. Set false for a deployment that manages its own roster.
app.seed-team-roster=${APP_SEED_TEAM_ROSTER:true}

# Email notifications (SMTP). Leave spring.mail.username/password blank to disable sending (logs a
# warning instead) -- used for local setup before SMTP credentials exist. Default host is Office
# 365's SMTP relay since fuzebot.io/cloudfuze.com accounts are Microsoft 365 -- override SMTP_HOST
# if the sending mailbox is on a different provider. Note: many Microsoft 365 tenants have SMTP AUTH
# (basic auth) disabled by default -- if sending fails with "SmtpClientAuthentication is disabled
# for the Tenant", the mailbox's admin needs to enable SMTP AUTH for that account.
spring.mail.host=${SMTP_HOST:smtp.office365.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:leo@fuzebot.io}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Hard connect/read/write timeouts (5s/10s/10s). Notification sends run on a background @Async pool
# now, but these guarantee a stuck SMTP socket can never pin a pool thread indefinitely (JavaMail's
# default timeout is infinite -- the original reason a bad/blank-credential send hung for many seconds).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Used to link to the Approvals page from outgoing emails.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# The one ADMIN row AdminBootstrap seeds into an empty app_users table, so the allowlist isn't a
# chicken-and-egg problem (someone must already be an admin before the "add a user" API works).
# Env-driven because the right first admin differs per deployment -- a value compiled into
# AdminBootstrap meant a fresh database anywhere else seeded an admin who doesn't work there.
# Only used when app_users is completely empty; changing it later has no effect on an existing DB.
# No real address as the default: this repository is public, and one here is scraped for spam and
# names the ADMIN account of a tool holding customer migration data. The real value lives in .env
# (or GitHub Settings). Left non-blank so a forgotten variable seeds an unusable admin rather than
# skipping the seed entirely and leaving nobody able to sign in at all.
app.first-admin-email=${APP_FIRST_ADMIN_EMAIL:first.admin@yourdomain.com}

# Ticket lookup (TicketLookupService): "Log a Ticket" only asks for a ticket number -- status,
# reporter, summary, and the canonical link are all fetched from the ticketing system's REST API
# instead of being typed in by hand. Points at Neutara Technologies Ticketing as of 2026-08-18,
# replacing Jira Cloud.
#
# Leave ticketing.api-token blank to disable (mirrors the SMTP pattern above) -- the fetch then fails
# with a clear "isn't configured" message rather than a raw connection error.
#
# ticketing.base-url is the root of the site, trailing slash optional (it is stripped):
#   https://neutaraticketing.cftools.live
# ticketing.api-token is a bearer token ("nta_..."), sent as `Authorization: Bearer <token>`. It
# identifies the acting user on its own, so unlike Jira's HTTP Basic there is NO email to configure --
# the old JIRA_EMAIL had no successor and was dropped rather than kept as a field nothing reads.
#
# THIS IS A REAL SECRET. It stays a ${ENV_VAR:} placeholder here (see .claude/rules/security-rules.md);
# put the literal token in the environment or in the gitignored backend/application.properties.
ticketing.base-url=${TICKETING_BASE_URL:https://neutaraticketing.cftools.live}
ticketing.api-token=${TICKETING_API_TOKEN:}

# ---------------------------------------------------------------------------------------------------
# PMO project sync (PmoProjectClient / PmoSyncService). Projects are created in the PMO tool (Neutara
# PM) first; this pulls that list in so nobody re-types them here. One-way: PMO owns which projects
# exist and what they are called, this tool owns everything else about them.
#
# pmo.base-url is the ROOT of the PMO site, no path and no port. Do NOT add :3001 -- that is PMO's
# internal app port and it is not reachable from off-box; publicly the app sits behind nginx on 443.
# pmo.api-key is sent as the `X-API-Key` header.
#
# THIS IS A REAL SECRET. It stays a ${ENV_VAR:} placeholder here (see .claude/rules/security-rules.md);
# put the literal key in the environment or in the gitignored backend/application.properties. Blank
# disables the sync entirely (mirrors the SMTP and ticketing patterns above) -- the scheduled poll
# becomes a no-op and the manual trigger returns a clear "isn't configured" message.
pmo.base-url=${PMO_BASE_URL:https://neutarapm.cftools.live}
pmo.api-key=${PMO_API_KEY:}

# Which PMO statuses the batch poll imports, comma-separated. ACTIVE
# only by product decision on 2026-08-26: PMO returns 190 projects of which 105 are COMPLETED and 1
# CANCELLED, and finished work can never need a pre-check. Widen to e.g. ACTIVE,ON_HOLD or leave blank
# to import every status.
pmo.import-statuses=${PMO_IMPORT_STATUSES:ACTIVE}

# Which PMO phases the poll imports, comma-separated. DELTA only: this tool is a pre-Delta readiness
# checklist, so a project in KICKOFF or PILOT_MIGRATION has no pre-check to fill in yet, and it arrives
# on its own the first poll after PMO advances it. PMO's phases: KICKOFF, PILOT_MIGRATION,
# ONETIME_MIGRATION, DELTA, FINAL_VALIDATION, CLOSURE, COMPLETED. Blank imports every phase -- which is
# what the poll did before 2026-08-29, and why the deployed database holds projects in every phase.
#
# This gates CREATION only. A project already mirrored here keeps syncing whatever phase PMO reports,
# so one that advances past DELTA does not freeze at the phase it had when it stopped matching -- that
# label is what tells an admin which rows are stale. Nothing here ever deletes: clearing out the
# pre-2026-08-29 imports is a deliberate human action, not something a poll should do behind your back.
pmo.import-phases=${PMO_IMPORT_PHASES:DELTA}

# Background poll (PmoSyncService.scheduledSync) -- ON, running as a reconciliation pass alongside the
# Delta-phase webhook below. It was switched off when the webhook landed, on the reasoning that the
# webhook is the one path projects arrive by; it is back on because the webhook is a single delivery
# with no retry on PMO's side, and pmo.webhook-api-key being unset makes it refuse every call
# (correctly, but silently from our end). The poll is the safety net that notices either. Both paths
# share the same per-project logic, so a project is identical whichever one created it, and the poll
# now honours pmo.import-phases so it can no longer re-import the non-Delta projects it pulled in
# before 2026-08-29. Set PMO_AUTO_SYNC_ENABLED=false to switch it back off.
pmo.auto-sync-enabled=${PMO_AUTO_SYNC_ENABLED:true}
pmo.sync-interval-ms=${PMO_SYNC_INTERVAL_MS:300000}
pmo.sync-initial-delay-ms=${PMO_SYNC_INITIAL_DELAY_MS:60000}

# Delta-phase webhook (PmoWebhookController / PmoWebhookService), POST /api/webhooks/pmo/delta-phase.
# PMO Tracker calls this the instant a project's phase moves to DELTA, with the project's manager and
# phase inline in the payload -- so the project (and its manager's whole team, per TeamService) is
# created here in near-real-time, without waiting on any poll.
#
# THIS IS A REAL SECRET, same placeholder rule as pmo.api-key above -- environment only, never a
# literal here. Deliberately a SEPARATE property/env var from PMO_API_KEY even though PMO's team may
# configure it to the identical value: PMO_API_KEY is the key THIS app presents to PMO (outbound,
# PmoProjectClient); this one is the key PMO must present to US (inbound). Blank refuses every call
# (loud, not silently open) rather than disabling the endpoint.
pmo.webhook-api-key=${PMO_WEBHOOK_API_KEY:}

# ---------------------------------------------------------------------------------------------------
# Metabase (MetabaseClient). Where the migration data itself lives -- one database per customer
# engagement, browsable at ${metabase.base-url}/browse/databases. This tool reads the database LIST so
# a project can be pointed at its own one from a dropdown (Project.metabaseDatabaseName) instead of
# somebody retyping a name; the per-project processed/conflict figures come later.
#
# metabase.base-url is the ROOT of the Metabase site, no path.
#
# TWO AUTH MODES, key preferred (see MetabaseClient's class comment):
#   metabase.api-key                     -> sent as the `x-api-key` header. Metabase 0.49+, created
#                                           under Admin > Authentication > API keys. Scoped and
#                                           revocable, and keeps a human's password out of the env.
#   metabase.username + metabase.password -> posted to /api/session for a session token, sent as
#                                           `X-Metabase-Session`. Only because API keys are an
#                                           admin-enabled feature that may be switched off here.
# If both are set the API key wins.
#
# ALL THREE OF THESE ARE REAL SECRETS. They stay ${ENV_VAR:} placeholders here (see
# .claude/rules/security-rules.md); put the literal values in the environment. Blank disables the
# integration -- GET /api/metabase/databases returns a clear "isn't configured" message and the project
# page falls back to a plain text field, so the database name can still be set by hand.
metabase.base-url=${METABASE_BASE_URL:https://metabase.cloudfuze.com}
metabase.api-key=${METABASE_API_KEY:}
metabase.username=${METABASE_USERNAME:}
metabase.password=${METABASE_PASSWORD:}
