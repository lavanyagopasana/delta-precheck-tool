spring.application.name=delta-migration-tracker

# Overridable so a container/host can remap the listen port without a rebuild (Cloud Run, Heroku and
# similar inject PORT; SERVER_PORT covers a plain docker -e). 8081 stays the local default.
server.port=${SERVER_PORT:${PORT:8081}}

# Unlike MySQL's connection string, Postgres has no createDatabaseIfNotExist-style flag -- the
# target database has to exist before the app's first connection. One-time setup:
# `createdb delta_migration_tracker` (or `psql -c "CREATE DATABASE delta_migration_tracker;"`) as
# whatever role DB_USERNAME/DB_PASSWORD resolve to. Everything after that (tables, columns,
# constraints) is still created/evolved automatically by ddl-auto=update below.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delta_migration_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool. Defaults (10 max / min-idle == max) are usually fine, but making them
# explicit documents intent and lets leak detection catch any connection held > 30s (e.g. a slow
# external call accidentally left inside a @Transactional method -- the exact footgun this audit fixed).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# No spring.jpa.database-platform here -- Hibernate 6 detects the dialect (now PostgreSQLDialect)
# from the JDBC connection metadata on its own; setting it explicitly only produced a deprecation
# warning under the old MySQL config, so it's left unset rather than swapped to the Postgres
# equivalent and warned about again.

# JDBC batching for bulk update/flush paths. NOTE: every entity uses GenerationType.IDENTITY, so
# Hibernate can't batch INSERTs (it must round-trip each row to read back the generated id) -- this
# mainly benefits batched UPDATEs and multi-entity flushes. Harmless and standard to set regardless.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Gzip JSON/text responses over 1KB (list endpoints, dashboard summary) to cut transfer time.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local dev default is a relative "uploads" folder next to wherever the jar runs from. In a
# container, this MUST be overridden (APP_UPLOAD_DIR) to an absolute path backed by a mounted
# volume (Docker volume / Kubernetes PersistentVolumeClaim) -- a container's own filesystem is
# wiped on every restart/redeploy, so anything written to the default relative path is lost the
# next time the container recreates. Read by both FileStorageService (writes) and WebConfig
# (serves /uploads/** statically) -- both point at this same property, so one override covers both.
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# File-upload type validation rollout (see FileStorageService.validateType). Stage 1 == false:
# mismatched extension / declared type / magic bytes are logged as warnings but the upload is still
# accepted, so we can observe whether real uploads ever fall outside the allowlist. Stage 2: set
# true (or APP_UPLOAD_ENFORCE_VALIDATION=true) to start rejecting those with a clear 400. Zero-byte
# files and path-traversal filenames are already rejected/neutralized unconditionally.
app.upload.enforce-validation=false

# Comma-separated list of origins allowed to call /api/**. Add the deployed frontend's origin here
# via APP_ALLOWED_ORIGINS in production -- localhost:3000 stays the default for local dev.
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# Sign-in with Microsoft (Entra ID). Client ID and tenant ID are baked in as defaults below --
# neither is a secret (both are public OAuth identifiers, safe to commit; the actual credential
# guarding sign-in is Microsoft's own password/MFA check, not these values). This is a
# single-tenant app registration (azure.tenant-id is set), so only accounts in that specific
# Entra ID tenant can authenticate at all -- any other tenant's issuer is rejected outright by
# SecurityConfig's JWT validation, before the AppUser allowlist is even checked.
#
# azure.allowed-email-domain is temporarily blank (no domain restriction) while testing with
# non-cloudfuze.com accounts. Set AZURE_ALLOWED_EMAIL_DOMAIN=cloudfuze.com to re-enable it. The
# AppUser allowlist (admin-managed, see AdminController) still applies regardless -- only people
# an admin has explicitly added can actually use the app.
azure.client-id=${AZURE_CLIENT_ID:4145c1b2-a596-4d84-bede-6e2ca276c9c7}
azure.tenant-id=${AZURE_TENANT_ID:807d6772-847c-40e2-9bec-e2c930b3a42e}
azure.allowed-email-domain=${AZURE_ALLOWED_EMAIL_DOMAIN:}

# Only people an admin has explicitly added under Manage Access can sign in. Set
# AZURE_REQUIRE_ALLOWLIST=false only for local testing with accounts nobody's added yet --
# never in a real deployment.
azure.require-allowlist=${AZURE_REQUIRE_ALLOWLIST:true}

# Anyone signing in with this email domain is auto-added to Manage Access (role: Migration
# Engineer) the first time they show up -- no admin approval needed, and this applies even when
# azure.require-allowlist=true. Other domains still need an admin to add them manually.
azure.auto-provision-domain=${AZURE_AUTO_PROVISION_DOMAIN:cloudfuze.com}

# Email notifications (SMTP). Leave spring.mail.username/password blank to disable sending (logs a
# warning instead) -- used for local setup before SMTP credentials exist. Default host is Office
# 365's SMTP relay since fuzebot.io/cloudfuze.com accounts are Microsoft 365 -- override SMTP_HOST
# if the sending mailbox is on a different provider. Note: many Microsoft 365 tenants have SMTP AUTH
# (basic auth) disabled by default -- if sending fails with "SmtpClientAuthentication is disabled
# for the Tenant", the mailbox's admin needs to enable SMTP AUTH for that account.
spring.mail.host=${SMTP_HOST:smtp.office365.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:leo@fuzebot.io}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Hard connect/read/write timeouts (5s/10s/10s). Notification sends run on a background @Async pool
# now, but these guarantee a stuck SMTP socket can never pin a pool thread indefinitely (JavaMail's
# default timeout is infinite -- the original reason a bad/blank-credential send hung for many seconds).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Used to link to the Approvals page from outgoing emails.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# The one ADMIN row AdminBootstrap seeds into an empty app_users table, so the allowlist isn't a
# chicken-and-egg problem (someone must already be an admin before the "add a user" API works).
# Env-driven because the right first admin differs per deployment -- a value compiled into
# AdminBootstrap meant a fresh database anywhere else seeded an admin who doesn't work there.
# Only used when app_users is completely empty; changing it later has no effect on an existing DB.
app.first-admin-email=${APP_FIRST_ADMIN_EMAIL:lavanya.gopasana@cloudfuze.com}

# Jira ticket lookup (JiraService): "Log a Ticket" only asks for a ticket number -- status, reporter,
# summary, and the browse URL are all fetched from Jira's REST API instead of being typed in by
# hand. Leave jira.api-token blank to disable (mirrors the SMTP pattern above) -- the fetch then
# fails with a clear "Jira integration isn't configured" message rather than a raw connection error.
# jira.base-url is the root of your Jira site, no trailing slash (e.g. https://yourcompany.atlassian.net).
# jira.email + jira.api-token authenticate via HTTP Basic, per Jira Cloud's REST API auth model --
# generate an API token at https://id.atlassian.com/manage-profile/security/api-tokens.
jira.base-url=${JIRA_BASE_URL:}
jira.email=${JIRA_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}
