server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing -- every path that isn't a real static file must
    # fall back to index.html, or refreshing on e.g. /projects/3 404s at the server instead of
    # letting the SPA's own router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # runtime-config.js is deliberately edited on the server AFTER the build (see
    # src/config/runtimeConfig.js's comments) -- it must never be cached, or editing it has no
    # visible effect until a client's cache expires.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed filenames (main.<hash>.js, etc.) are safe to cache aggressively -- a new build always
    # gets a new hash, so there's no staleness risk.
    location ~* \.(?:js|css|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
