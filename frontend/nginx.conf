server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MUST stay >= spring.servlet.multipart.max-file-size (1GB), or nginx rejects the upload before
    # Spring ever sees it and the app's own limit becomes a fiction. nginx's default is 1m, and on the
    # deployed site that default was live in front of /api: measured on 2026-08-12, a 1000KB evidence
    # file uploaded fine and 1024KB got a raw nginx "413 Request Entity Too Large" HTML page -- so
    # every realistic screenshot or screen recording failed, with an error the frontend can't even
    # parse (it expects the JSON envelope, not HTML).
    #
    # NOTE: whichever proxy actually terminates TLS and routes /api to the backend needs this same
    # setting. This block only covers requests that reach THIS container, so setting it here is
    # necessary but not sufficient -- see the QA report's BUG-010.
    client_max_body_size 1g;

    # nginx's built-in gzip default only covers text/html, so without this block every .js/.css
    # asset shipped raw -- measured on the deployed site: 701KB sent where 204KB would do (71%
    # waste, 486KB per cold load), because main.js alone is 494KB uncompressed vs 143KB gzipped.
    # gzip_types deliberately excludes text/html: nginx always compresses that and listing it
    # emits a duplicate-MIME warning at startup.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # react-router-dom uses client-side routing -- every path that isn't a real static file must
    # fall back to index.html, or refreshing on e.g. /projects/3 404s at the server instead of
    # letting the SPA's own router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browsers request /favicon.ico unprompted. This app ships favicon.png instead, so without an
    # explicit rule the request falls through to the SPA catch-all and every visitor is served a
    # full index.html as their "icon". 204 is cheaper and semantically honest.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # No robots.txt meant crawlers got index.html (HTTP 200) and could index the login page. The
    # whole app is behind Entra ID, so nothing here should ever be indexed.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # runtime-config.js is deliberately edited on the server AFTER the build (see
    # src/config/runtimeConfig.js's comments) -- it must never be cached, or editing it has no
    # visible effect until a client's cache expires.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    # Hashed filenames (main.<hash>.js, etc.) are safe to cache aggressively -- a new build always
    # gets a new hash, so there's no staleness risk.
    #
    # Deliberately ONE add_header rather than `expires 30d` + a second add_header: `expires`
    # emits its own Cache-Control, so the pair produced two conflicting Cache-Control headers on
    # every asset (`max-age=2592000` and `public, immutable`). Some intermediaries honour only the
    # first, dropping both `public` and `immutable` and costing needless revalidation.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|map)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
